name: CI

on:
  push:
    branches: [ main, master, "copilot/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # ── 1. R script syntax check ──────────────────────────────────────────
  r-syntax:
    name: R script syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Check R script syntax
        run: |
          failed=0
          for f in scripts/*.R; do
            echo "Checking $f …"
            Rscript --vanilla -e "parse(file='$f')" || { echo "SYNTAX ERROR in $f"; failed=1; }
          done
          exit $failed

  # ── 2. Python script syntax + downstream pipeline test ────────────────
  python-test:
    name: Python syntax + downstream pipeline test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install matplotlib numpy scipy pandas

      - name: Check Python script syntax
        run: |
          python3 -m py_compile scripts/benchmark_convert_pretty_to_vcf.py
          python3 -m py_compile scripts/merge_callers_prepare_annovar.py
          python3 -m py_compile scripts/run_pipeline_test.py
          echo "Python syntax OK"

      - name: Run downstream pipeline test
        run: |
          python3 scripts/run_pipeline_test.py \
            --data   test_data/synthetic_pretty.csv \
            --target test_data/target.bed \
            --bait   test_data/bait.bed \
            --outdir /tmp/ci_test_results

      - name: Show test summary
        if: always()
        run: |
          echo "=== benchmark_summary.csv ==="
          cat /tmp/ci_test_results/benchmark_summary.csv || true
          echo "=== territory_summary.csv ==="
          cat /tmp/ci_test_results/territory_summary.csv || true
          echo "=== tmb_summary.csv ==="
          cat /tmp/ci_test_results/tmb_summary.csv || true
          ls /tmp/ci_test_results/plots/ || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-report
          path: /tmp/ci_test_results/
          retention-days: 30

  # ── 3. Nextflow lint ──────────────────────────────────────────────────
  nf-lint:
    name: Nextflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "23.10.0"

      - name: Check Nextflow config syntax
        run: |
          # Validate main nextflow config is parseable
          nextflow config -show-profiles 2>&1 | head -20 || true
          echo "Config check done"

      - name: Check module files exist (include paths)
        run: |
          # Verify all include paths in main.nf resolve to existing files
          failed=0
          grep "include {" main.nf | sed 's|.*from "\(.*\)".*|\1.nf|' | while read path; do
            # strip leading ./
            path="${path#./}"
            if [ ! -f "$path" ]; then
              echo "Missing module file: $path"
              failed=1
            else
              echo "OK: $path"
            fi
          done
          exit $failed

  # ── 4. downstream-nextflow-test (from_pretty_csv end-to-end) ─────────
  downstream-nextflow-test:
    name: Nextflow from_pretty_csv integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "23.10.0"

      - name: Install R and required packages
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R dependencies
        run: |
          Rscript -e "install.packages(c('data.table', 'openxlsx', 'ggplot2', 'dplyr', 'tidyr', 'stringr', 'knitr', 'rmarkdown'), repos='https://cloud.r-project.org')"

      - name: Generate test Rdata reference files
        run: Rscript test_data/generate_test_rdata.R

      - name: Run from_pretty_csv pipeline
        run: |
          nextflow run main.nf \
            -entry from_pretty_csv \
            -c test_data/params_from_pretty_csv_test.config \
            -profile local \
            --skip_quarto_report true \
            -ansi-log false

      - name: Validate pipeline outputs
        run: bash scripts/validate_test_outputs.sh results_test_pretty

      - name: Show output summary
        if: always()
        run: |
          echo "=== Pipeline output tree ==="
          find results_test_pretty -type f | sort || true

      - name: Upload pipeline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-nextflow-results
          path: results_test_pretty/
          retention-days: 7

  # ── 5. from-fastq-smoke-test ──────────────────────────────────────────
  from-fastq-smoke-test:
    name: Nextflow from_fastq smoke test (samplesheet parse + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "23.10.0"

      - name: Verify mock reference files exist
        run: |
          echo "Checking mock reference files..."
          for f in test_data/reference/ref.fa \
                   test_data/reference/ref.fa.fai \
                   test_data/reference/dbsnp.vcf \
                   test_data/reference/cosmic.vcf; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
              exit 1
            fi
          done

      - name: Verify from_fastq samplesheet
        run: |
          echo "Checking samplesheet_fastq.csv..."
          python3 - <<'PY'
          import csv, sys
          required = {"sample_id", "run_mode", "fastq_r1"}
          with open("test_data/samplesheet_fastq.csv") as fh:
              reader = csv.DictReader(fh)
              for col in required:
                  if col not in reader.fieldnames:
                      print(f"ERROR: missing column '{col}' in samplesheet_fastq.csv", file=sys.stderr)
                      sys.exit(1)
              rows = list(reader)
          print(f"samplesheet_fastq.csv OK: {len(rows)} sample(s), columns: {reader.fieldnames}")
          PY

      - name: Nextflow config parse for from_fastq
        run: |
          # Validate that Nextflow can parse the mock config without errors
          nextflow config test_data/params_from_fastq_mock.config 2>&1 | head -30 || true
          echo "from_fastq config parse done"
