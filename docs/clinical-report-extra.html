<!-- clinical-report-extra.html: additional JS for interactive tables and UI polish -->
<script>
/* Highlight low-frequency variants */
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("table td").forEach(function (td) {
    var val = parseFloat(td.textContent);
    if (!isNaN(val)) {
      if (td.dataset.field === "freq" && val < 0.05) {
        td.style.color = "#c0392b";
        td.style.fontWeight = "bold";
      }
      if (td.dataset.field === "dp" && val < 10) {
        td.style.color = "#e67e22";
      }
    }
  });

  /* Add simple sort-on-click to static tables that have class "sortable" */
  document.querySelectorAll("table.sortable").forEach(function (table) {
    var headers = table.querySelectorAll("th");
    headers.forEach(function (th, col) {
      th.style.cursor = "pointer";
      th.title = "Click to sort";
      th.addEventListener("click", function () {
        sortTable(table, col);
      });
    });
  });
});

function sortTable(table, col) {
  var tbody = table.querySelector("tbody") || table;
  var rows = Array.from(tbody.querySelectorAll("tr"));
  var asc = table.dataset.sortAsc !== "1";
  table.dataset.sortAsc = asc ? "1" : "0";
  rows.sort(function (a, b) {
    var av = a.cells[col] ? a.cells[col].textContent.trim() : "";
    var bv = b.cells[col] ? b.cells[col].textContent.trim() : "";
    var an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
    return asc ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  rows.forEach(function (r) { tbody.appendChild(r); });
}
</script>
